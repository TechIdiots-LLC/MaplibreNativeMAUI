name: Build and Release

on:
  workflow_dispatch:
    inputs:
      line:
        description: >-
          Which package line to publish. "experimental" builds the
          MapLibreNative.Maui.Experimental family from VERSION.experimental;
          run it from the experimental branch, not main.
        type: choice
        default: stable
        options:
          - stable
          - experimental
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version:      ${{ steps.check.outputs.version }}
      published:    ${{ steps.check.outputs.published }}
      experimental: ${{ steps.check.outputs.experimental }}

    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION and check GitHub releases
        id: check
        run: |
          # A push to main is always the stable line: the input only exists on a
          # manual dispatch, and is empty otherwise.
          LINE="${{ inputs.line || 'stable' }}"

          if [ "$LINE" = "experimental" ]; then
            if [ ! -f VERSION.experimental ]; then
              echo "::error::No VERSION.experimental here. The experimental line" \
                   "is released from the experimental branch, not from $GITHUB_REF_NAME."
              exit 1
            fi
            VERSION=$(cat VERSION.experimental | tr -d '[:space:]')
            echo "experimental=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
            echo "experimental=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Line: $LINE"
          echo "Version: $VERSION"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "published=true"  >> "$GITHUB_OUTPUT"
            echo "Already released — skipping build."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Not yet released — proceeding."
          fi

  # ── Native builds (reuse per-platform CI workflows) ───────────────────────
  build-windows:
    name: Build Windows OpenGL native
    needs: version-check
    if: needs.version-check.outputs.published == 'false'
    uses: ./.github/workflows/native-windows.yml

  build-android:
    name: Build Android OpenGL native
    needs: version-check
    if: needs.version-check.outputs.published == 'false'
    uses: ./.github/workflows/native-android.yml

  build-apple:
    name: Build Apple Metal native
    needs: version-check
    if: needs.version-check.outputs.published == 'false'
    uses: ./.github/workflows/native-apple.yml

  build-windows-vulkan:
    name: Build Windows Vulkan native
    needs: version-check
    if: needs.version-check.outputs.published == 'false'
    uses: ./.github/workflows/native-windows-vulkan.yml

  build-android-vulkan:
    name: Build Android Vulkan native
    needs: version-check
    if: needs.version-check.outputs.published == 'false'
    uses: ./.github/workflows/native-android-vulkan.yml

  build-apple-vulkan:
    name: Build Apple Vulkan native
    needs: version-check
    if: needs.version-check.outputs.published == 'false'
    uses: ./.github/workflows/native-apple-vulkan.yml

  # ── NuGet packaging ───────────────────────────────────────────────────────
  pack:
    name: Pack NuGet
    runs-on: macos-latest
    needs: [version-check, build-windows, build-android, build-apple]
    if: needs.version-check.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and 9 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Arrange native libs for bindings project
        run: |
          N=bindings/native
          mkdir -p $N/win-x64 $N/win-arm64
          mkdir -p $N/android-arm64 $N/android-arm $N/android-x64
          mkdir -p $N/ios-arm64 $N/iossimulator-arm64 $N/maccatalyst

            find native-artifacts/native-windows-x64 -name "mln-cabi.dll" -exec cp {} $N/win-x64/ \;
            find native-artifacts/native-windows-arm64 -name "mln-cabi.dll" -exec cp {} $N/win-arm64/ \;
            find native-artifacts/native-android-arm64-v8a -name "libmln-cabi.so" -exec cp {} $N/android-arm64/ \;
            find native-artifacts/native-android-armeabi-v7a -name "libmln-cabi.so" -exec cp {} $N/android-arm/ \;
            find native-artifacts/native-android-x86_64 -name "libmln-cabi.so" -exec cp {} $N/android-x64/ \;
            find native-artifacts/native-ios-arm64 -name "libmln-cabi.a" -exec cp {} $N/ios-arm64/ \;
            find native-artifacts/native-iossimulator-arm64 -name "libmln-cabi.a" -exec cp {} $N/iossimulator-arm64/ \;
            find native-artifacts/native-maccatalyst -name "libmln-cabi.a" -exec cp {} $N/maccatalyst/ \;

          echo "Native libs arranged:"
          find $N -type f
      - name: Create iOS XCFramework
        run: |
          N=bindings/native
          mkdir -p $N/ios
          XCFW_ARGS=""
          [ -f $N/ios-arm64/libmln-cabi.a ]         && XCFW_ARGS="$XCFW_ARGS -library $N/ios-arm64/libmln-cabi.a"
          [ -f $N/iossimulator-arm64/libmln-cabi.a ] && XCFW_ARGS="$XCFW_ARGS -library $N/iossimulator-arm64/libmln-cabi.a"
          if [ -n "$XCFW_ARGS" ]; then
            xcodebuild -create-xcframework \
              $XCFW_ARGS \
              -output $N/ios/libmln-cabi.xcframework
            echo "XCFramework created at $N/ios/libmln-cabi.xcframework"
          else
            echo "No iOS libraries found; skipping XCFramework creation."
          fi
      - name: Restore workloads
        run: dotnet workload restore maplibre-maui.sln

      - name: Pack MapLibreNative.Maui
        run: |
          dotnet pack bindings/MapLibreNative.Maui.csproj \
            -c Release \
            -p:Version=${{ needs.version-check.outputs.version }} \
            -p:Experimental=${{ needs.version-check.outputs.experimental }} \
            -p:_MlnNativeDir=$(pwd)/bindings/native/ \
            -o artifacts/

      - name: Pack MapLibreNative.Maui.Handlers
        run: |
          dotnet pack handlers/MapLibreNative.Maui.Handlers.csproj \
            -c Release \
            -p:Version=${{ needs.version-check.outputs.version }} \
            -p:Experimental=${{ needs.version-check.outputs.experimental }} \
            -o artifacts/

      # Only on the experimental line: the torrent tile source depends on the
      # host HTTP provider and the URL-claiming ABI, neither of which the stable
      # native carries.
      - name: Pack MapLibreNative.Maui.Torrent
        if: needs.version-check.outputs.experimental == 'true'
        run: |
          dotnet pack torrent/MapLibreNative.Maui.Torrent.csproj \
            -c Release \
            -p:Version=${{ needs.version-check.outputs.version }} \
            -p:Experimental=true \
            -o artifacts/

      # nuget.org rejects any package over 250 MB with a bare 413, so the size
      # is worth seeing in the log before the push step is reached.
      - name: Report package sizes
        shell: bash
        run: |
          LIMIT=$((250 * 1024 * 1024))
          for pkg in artifacts/*.nupkg; do
            SIZE=$(stat -c%s "$pkg" 2>/dev/null || stat -f%z "$pkg")
            echo "$(basename "$pkg"): $((SIZE / 1048576)) MiB"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$(basename "$pkg") is over nuget.org's 250 MB limit and cannot be pushed"
              exit 1
            fi
          done

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          retention-days: 7

  # ── Mobile-only NuGet feed (unblocks the mobile samples early) ────────────
  # `pack` cannot start until build-windows does, and its arm64 leg is a ~35 min
  # outlier -- so samples-mobile sat idle for ~22 minutes after the Apple natives
  # were ready, waiting on Windows DLLs it never opens. This packs the same two
  # projects from the Android and Apple natives alone, purely to feed that job.
  #
  # It has to be a *package* rather than a ProjectReference build: the
  # NativeReference items that put libmln-cabi on the link line for iOS and
  # macCatalyst live in buildTransitive/MapLibreNative.Maui.targets, which only
  # applies to package consumers. Building the sample from source fails at link
  # with undefined _mln_* symbols.
  #
  # The artifact name deliberately does NOT match `nuget-packages*`: the release
  # job downloads that pattern with merge-multiple and pushes the result to
  # nuget.org, so a matching name would overwrite the real package with this
  # Windows-less one.
  pack-mobile:
    name: Pack NuGet (mobile feed)
    runs-on: macos-latest
    needs: [version-check, build-android, build-apple]
    if: needs.version-check.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and 9 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download Android native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-android-*
          path: native-artifacts

      - name: Download Apple native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-ios*
          path: native-artifacts

      - name: Download macCatalyst native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-maccatalyst
          path: native-artifacts/native-maccatalyst

      - name: Arrange native libs for bindings project
        run: |
          N=bindings/native
          mkdir -p $N/android-arm64 $N/android-arm $N/android-x64
          mkdir -p $N/ios-arm64 $N/iossimulator-arm64 $N/maccatalyst

          find native-artifacts/native-android-arm64-v8a   -name "libmln-cabi.so" -exec cp {} $N/android-arm64/ \;
          find native-artifacts/native-android-armeabi-v7a -name "libmln-cabi.so" -exec cp {} $N/android-arm/   \;
          find native-artifacts/native-android-x86_64      -name "libmln-cabi.so" -exec cp {} $N/android-x64/   \;
          find native-artifacts/native-ios-arm64           -name "libmln-cabi.a"  -exec cp {} $N/ios-arm64/     \;
          find native-artifacts/native-iossimulator-arm64  -name "libmln-cabi.a"  -exec cp {} $N/iossimulator-arm64/ \;
          find native-artifacts/native-maccatalyst         -name "libmln-cabi.a"  -exec cp {} $N/maccatalyst/   \;

          echo "Native libs arranged:"
          find $N -type f

      - name: Create iOS XCFramework
        run: |
          N=bindings/native
          mkdir -p $N/ios
          XCFW_ARGS=""
          [ -f $N/ios-arm64/libmln-cabi.a ]          && XCFW_ARGS="$XCFW_ARGS -library $N/ios-arm64/libmln-cabi.a"
          [ -f $N/iossimulator-arm64/libmln-cabi.a ] && XCFW_ARGS="$XCFW_ARGS -library $N/iossimulator-arm64/libmln-cabi.a"
          if [ -n "$XCFW_ARGS" ]; then
            xcodebuild -create-xcframework \
              $XCFW_ARGS \
              -output $N/ios/libmln-cabi.xcframework
            echo "XCFramework created at $N/ios/libmln-cabi.xcframework"
          else
            echo "No iOS libraries found; skipping XCFramework creation."
          fi

      - name: Restore workloads
        run: dotnet workload restore maplibre-maui.sln

      # Same version as the real packages, so the samples' Version="*-*"
      # reference resolves against this feed exactly as it would against `pack`.
      - name: Pack MapLibreNative.Maui
        run: |
          dotnet pack bindings/MapLibreNative.Maui.csproj \
            -c Release \
            -p:Version=${{ needs.version-check.outputs.version }} \
            -p:_MlnNativeDir=$(pwd)/bindings/native/ \
            -o artifacts/

      - name: Pack MapLibreNative.Maui.Handlers
        run: |
          dotnet pack handlers/MapLibreNative.Maui.Handlers.csproj \
            -c Release \
            -p:Version=${{ needs.version-check.outputs.version }} \
            -o artifacts/

      - name: Upload mobile feed
        uses: actions/upload-artifact@v4
        with:
          name: mobile-local-feed
          path: artifacts/*.nupkg
          retention-days: 7

  # ── WPF NuGet packaging (Windows runner — WPF SDK requires Windows) ───────
  pack-wpf:
    name: Pack WPF NuGet + Windows samples
    runs-on: windows-latest
    needs: [version-check, build-windows, build-windows-vulkan, pack]
    if: needs.version-check.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and 9 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download Windows native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-windows-*
          path: native-artifacts

      - name: Download Windows Vulkan native
        uses: actions/download-artifact@v4
        with:
          pattern: native-mln-windows-x64-vulkan
          path: vulkan-native

      - name: Stage native DLLs
        shell: bash
        run: |
          mkdir -p bindings/native/win-x64 bindings/native/win-arm64
          find native-artifacts/native-windows-x64  -name "mln-cabi.dll" -exec cp {} bindings/native/win-x64/ \;
          find native-artifacts/native-windows-arm64 -name "mln-cabi.dll" -exec cp {} bindings/native/win-arm64/ \;
          echo "Staged DLLs:"
          find bindings/native -name "*.dll"

      - name: Restore workloads
        run: dotnet workload install maui

      - name: Pack MapLibreNative.Maui.WPF
        shell: bash
        run: |
          dotnet pack wpf/MapLibreNative.Maui.WPF.csproj \
            -c Release \
            -p:Version=${{ needs.version-check.outputs.version }} \
            -p:Experimental=${{ needs.version-check.outputs.experimental }} \
            -o artifacts/

      - name: Download MAUI NuGet packages (for local feed)
        if: needs.version-check.outputs.experimental != 'true'
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: local-feed

      - name: Copy WPF NuGet to local feed
        if: needs.version-check.outputs.experimental != 'true'
        shell: bash
        run: cp artifacts/*.nupkg local-feed/

      - name: Add local NuGet feed
        if: needs.version-check.outputs.experimental != 'true'
        run: dotnet nuget add source "${{ github.workspace }}\local-feed" --name local-release

      - name: Restore MAUI workloads
        if: needs.version-check.outputs.experimental != 'true'
        run: dotnet workload restore sample/MauiSample.csproj

      - name: Publish ConsoleExample (win-x64)
        if: needs.version-check.outputs.experimental != 'true'
        shell: bash
        run: |
          dotnet publish sample/ConsoleExample/ConsoleExample.csproj \
            -c Release -r win-x64 --self-contained false \
            -f net10.0-windows10.0.19041.0 \
            -p:UseLocalPackages=true \
            -o publish/ConsoleExample-win-x64

      - name: Publish ConsoleExample (win-arm64)
        if: needs.version-check.outputs.experimental != 'true'
        shell: bash
        run: |
          dotnet publish sample/ConsoleExample/ConsoleExample.csproj \
            -c Release -r win-arm64 --self-contained false \
            -f net10.0-windows10.0.19041.0 \
            -p:UseLocalPackages=true \
            -o publish/ConsoleExample-win-arm64

      - name: Publish WpfExample (win-x64)
        if: needs.version-check.outputs.experimental != 'true'
        shell: bash
        run: |
          dotnet publish sample/WpfExample/WpfExample.csproj \
            -c Release -r win-x64 --self-contained false \
            -f net10.0-windows10.0.19041.0 \
            -p:UseLocalPackages=true \
            -o publish/WpfExample-win-x64

      - name: Publish WpfExample (win-arm64)
        if: needs.version-check.outputs.experimental != 'true'
        shell: bash
        run: |
          dotnet publish sample/WpfExample/WpfExample.csproj \
            -c Release -r win-arm64 --self-contained false \
            -f net10.0-windows10.0.19041.0 \
            -p:UseLocalPackages=true \
            -o publish/WpfExample-win-arm64

      - name: Publish MauiSample (win-x64)
        if: needs.version-check.outputs.experimental != 'true'
        shell: bash
        run: |
          dotnet publish sample/MauiSample.csproj \
            -f net9.0-windows10.0.19041.0 \
            -c Release -r win-x64 \
            -p:TargetFrameworks=net9.0-windows10.0.19041.0 \
            -p:WindowsPackageType=None \
            -p:UseLocalPackages=true \
            -o publish/MauiSample-win-x64

      # Vulkan variants: the managed layer is backend-agnostic, so each published app
      # runs on Vulkan simply by swapping in the Vulkan-built mln-cabi.dll — at runtime
      # the renderers (MapImageView, MlnMapImage, ConsoleExample) detect the "vulkan"
      # backend and use the offscreen read-back path.
      - name: Create Vulkan sample variants (win-x64)
        if: needs.version-check.outputs.experimental != 'true'
        shell: bash
        run: |
          DLL=$(find vulkan-native -name mln-cabi.dll | head -1)
          if [ -z "$DLL" ]; then echo "Vulkan mln-cabi.dll not found"; exit 1; fi
          echo "Overlaying Vulkan native: $DLL"
          for app in ConsoleExample WpfExample MauiSample; do
            cp -r "publish/${app}-win-x64" "publish/${app}-vulkan-win-x64"
            cp "$DLL" "publish/${app}-vulkan-win-x64/mln-cabi.dll"
            find "publish/${app}-vulkan-win-x64" -path "*runtimes/win-x64/native/mln-cabi.dll" \
              -exec cp "$DLL" {} \;
          done

      - name: Publish MauiSample (win-arm64)
        if: needs.version-check.outputs.experimental != 'true'
        shell: bash
        run: |
          dotnet publish sample/MauiSample.csproj \
            -f net9.0-windows10.0.19041.0 \
            -c Release -r win-arm64 \
            -p:TargetFrameworks=net9.0-windows10.0.19041.0 \
            -p:WindowsPackageType=None \
            -p:UseLocalPackages=true \
            -o publish/MauiSample-win-arm64

      - name: Zip sample outputs
        if: needs.version-check.outputs.experimental != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path samples -Force | Out-Null
          @(
            'ConsoleExample-win-x64','ConsoleExample-win-arm64',
            'WpfExample-win-x64','WpfExample-win-arm64',
            'MauiSample-win-x64','MauiSample-win-arm64',
            'ConsoleExample-vulkan-win-x64','WpfExample-vulkan-win-x64','MauiSample-vulkan-win-x64'
          ) | ForEach-Object {
            Compress-Archive -Path "publish/$_/*" -DestinationPath "samples/$_.zip"
          }

      - name: Upload WPF NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-wpf
          path: artifacts/*.nupkg
          retention-days: 7

      - name: Upload Windows samples
        if: needs.version-check.outputs.experimental != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-samples
          path: samples/*.zip
          retention-days: 7

  # ── Android + iOS + macCatalyst sample builds ───────────────────────────
  # Feeds off `pack-mobile`, not `pack`, so it is not gated on the Windows
  # natives it has no use for. It still consumes a real package -- it has to,
  # since the NativeReference items that link libmln-cabi into an iOS or
  # macCatalyst app live in buildTransitive/MapLibreNative.Maui.targets and
  # reach the app only through package consumption, never a ProjectReference.
  #
  # Stable line only. The samples reference the packages by their stable IDs and
  # restore them from a local feed, which under the renamed experimental line
  # holds nothing they ask for. Publishing experimental sample apps means giving
  # those csproj files a conditional reference first.
  samples-mobile:
    name: Build mobile + macCatalyst samples
    runs-on: macos-26
    needs: [version-check, pack-mobile]
    if: >-
      needs.version-check.outputs.published == 'false' &&
      needs.version-check.outputs.experimental != 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and 9 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download MAUI NuGet packages (for local feed)
        uses: actions/download-artifact@v4
        with:
          name: mobile-local-feed
          path: local-feed

      - name: Add local NuGet feed
        run: dotnet nuget add source $(pwd)/local-feed --name local-release

      - name: Restore MAUI workloads
        run: dotnet workload restore sample/MauiSample.csproj

      - name: Build MauiSample (android)
        run: |
          dotnet build sample/MauiSample.csproj \
            -f net9.0-android \
            -c Release \
            -p:EnableWindowsTargeting=true \
            -p:UseLocalPackages=true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-samples
          path: sample/bin/Release/net9.0-android/*Signed.apk
          retention-days: 7

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Build MauiSample (iOS simulator)
        run: |
          dotnet build sample/MauiSample.csproj \
            -f net9.0-ios \
            -r iossimulator-arm64 \
            -c Release \
            -p:EnableWindowsTargeting=true \
            -p:UseLocalPackages=true

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: sample-ios-simulator
          path: sample/bin/Release/net9.0-ios/iossimulator-arm64/**/*.app
          retention-days: 7

      - name: Build MauiSample (macCatalyst)
        run: |
          dotnet build sample/MauiSample.csproj \
            -f net9.0-maccatalyst \
            -c Release \
            -p:EnableCodeSigning=false \
            -p:EnableWindowsTargeting=true \
            -p:UseLocalPackages=true

      - name: Upload macCatalyst app
        uses: actions/upload-artifact@v4
        with:
          name: sample-maccatalyst
          path: sample/bin/Release/net9.0-maccatalyst/**/*.app
          retention-days: 7

  # ── Vulkan NuGet packaging ────────────────────────────────────────────────
  pack-vulkan:
    name: Pack Vulkan NuGet
    runs-on: macos-latest
    needs: [version-check, build-windows-vulkan, build-android-vulkan, build-apple-vulkan]
    if: needs.version-check.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and 9 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Vulkan native artifacts for every platform share the native-mln-*-vulkan
      # naming (Windows/Android/Apple), so one pattern collects them all.
      - name: Download MLN Vulkan native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-mln-*
          path: mln-artifacts

      - name: Arrange native libs for Vulkan bindings project
        run: |
          N=bindings/native-vulkan
          mkdir -p $N/win-x64 $N/win-arm64
          mkdir -p $N/android-arm64 $N/android-arm $N/android-x64
          mkdir -p $N/ios-arm64 $N/iossimulator-arm64 $N/maccatalyst

          find mln-artifacts/native-mln-windows-x64-vulkan       -name "mln-cabi.dll"   -exec cp {} $N/win-x64/       \; 2>/dev/null || true
          find mln-artifacts/native-mln-windows-arm64-vulkan     -name "mln-cabi.dll"   -exec cp {} $N/win-arm64/     \; 2>/dev/null || true
          find mln-artifacts/native-mln-android-arm64-v8a        -name "libmln-cabi.so" -exec cp {} $N/android-arm64/ \; 2>/dev/null || true
          find mln-artifacts/native-mln-android-armeabi-v7a      -name "libmln-cabi.so" -exec cp {} $N/android-arm/   \; 2>/dev/null || true
          find mln-artifacts/native-mln-android-x86_64           -name "libmln-cabi.so" -exec cp {} $N/android-x64/   \; 2>/dev/null || true
          find mln-artifacts/native-mln-ios-arm64-vulkan          -name "libmln-cabi.a"  -exec cp {} $N/ios-arm64/     \; 2>/dev/null || true
          find mln-artifacts/native-mln-iossimulator-arm64-vulkan -name "libmln-cabi.a"  -exec cp {} $N/iossimulator-arm64/ \; 2>/dev/null || true
          find mln-artifacts/native-mln-maccatalyst-vulkan        -name "libmln-cabi.a"  -exec cp {} $N/maccatalyst/   \; 2>/dev/null || true

          echo "Vulkan native libs arranged:"
          find $N -type f

      - name: Create iOS XCFramework
        run: |
          N=bindings/native-vulkan
          mkdir -p $N/ios
          XCFW_ARGS=""
          [ -f $N/ios-arm64/libmln-cabi.a ]          && XCFW_ARGS="$XCFW_ARGS -library $N/ios-arm64/libmln-cabi.a"
          [ -f $N/iossimulator-arm64/libmln-cabi.a ] && XCFW_ARGS="$XCFW_ARGS -library $N/iossimulator-arm64/libmln-cabi.a"
          if [ -n "$XCFW_ARGS" ]; then
            xcodebuild -create-xcframework \
              $XCFW_ARGS \
              -output $N/ios/libmln-cabi.xcframework
            echo "XCFramework created at $N/ios/libmln-cabi.xcframework"
          else
            echo "No iOS libraries found; skipping XCFramework creation."
          fi

      - name: Restore workloads
        run: dotnet workload restore maplibre-maui.sln

      - name: Pack MapLibreNative.Maui.Vulkan
        run: |
          dotnet pack bindings/MapLibreNative.Maui.Vulkan.csproj \
            -c Release \
            -p:Version=${{ needs.version-check.outputs.version }} \
            -p:Experimental=${{ needs.version-check.outputs.experimental }} \
            -p:_MlnNativeDir=$(pwd)/bindings/native-vulkan/ \
            -o artifacts/

      # nuget.org rejects any package over 250 MB with a bare 413, so the size
      # is worth seeing in the log before the push step is reached.
      - name: Report package sizes
        shell: bash
        run: |
          LIMIT=$((250 * 1024 * 1024))
          for pkg in artifacts/*.nupkg; do
            SIZE=$(stat -c%s "$pkg" 2>/dev/null || stat -f%z "$pkg")
            echo "$(basename "$pkg"): $((SIZE / 1048576)) MiB"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$(basename "$pkg") is over nuget.org's 250 MB limit and cannot be pushed"
              exit 1
            fi
          done

      - name: Upload Vulkan NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-vulkan
          path: artifacts/*.nupkg
          retention-days: 7

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version-check, pack, pack-wpf, pack-vulkan, samples-mobile]
    # samples-mobile is skipped on the experimental line, and a skipped dependency
    # would otherwise take this job with it. !cancelled() lets a skip through
    # while still refusing to publish when a job it needs actually failed.
    if: >-
      !cancelled() &&
      needs.version-check.outputs.published == 'false' &&
      needs.pack.result == 'success' &&
      needs.pack-wpf.result == 'success' &&
      needs.pack-vulkan.result == 'success' &&
      (needs.samples-mobile.result == 'success' || needs.samples-mobile.result == 'skipped')
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK (for nuget push)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          pattern: nuget-packages*
          merge-multiple: true
          path: artifacts/

      - name: Download Windows sample zips
        if: needs.version-check.outputs.experimental != 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows-samples
          path: artifacts/

      - name: Download mobile samples (Android APK)
        if: needs.version-check.outputs.experimental != 'true'
        uses: actions/download-artifact@v4
        with:
          name: mobile-samples
          path: artifacts/

      - name: Download iOS simulator app
        if: needs.version-check.outputs.experimental != 'true'
        uses: actions/download-artifact@v4
        with:
          name: sample-ios-simulator
          path: artifacts/ios-simulator/

      - name: Download macCatalyst app
        if: needs.version-check.outputs.experimental != 'true'
        uses: actions/download-artifact@v4
        with:
          name: sample-maccatalyst
          path: artifacts/maccatalyst/

      - name: Zip iOS simulator and macCatalyst apps
        run: |
          for app in artifacts/ios-simulator/**/*.app artifacts/maccatalyst/**/*.app; do
            [ -d "$app" ] || continue
            name=$(basename "$app" .app)
            zip -r "artifacts/${name}.zip" "$app"
          done

      - name: Extract changelog for version
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## $VERSION" \
              'BEGIN{p=0} $0==ver{p=1;next} /^## /&&p{exit} p{print}' \
              CHANGELOG.md > release-notes.md
          else
            echo "Release v${VERSION}." > release-notes.md
          fi

          if [ "${{ needs.version-check.outputs.experimental }}" = "true" ]; then
            # Said before the notes, because what these packages are is the first
            # thing somebody arriving at the release needs to know.
            cat > header.md <<'EOF'
          > **Experimental line.** These are the `MapLibreNative.Maui.Experimental.*`
          > packages, built against a fork of maplibre-native (`terrain-3d-color-relief`)
          > for 3D terrain, and shipping the torrent tile source. They are a preview of
          > the next major version; the stable `MapLibreNative.Maui` 4.x line continues
          > separately and still receives minor and patch releases.
          >
          > The assemblies keep their usual names, so swapping the package reference is
          > the whole migration — and for the same reason the two lines cannot be
          > installed side by side.
          >
          > No sample apps are attached to experimental releases.

          EOF
            cat header.md release-notes.md > notes.tmp && mv notes.tmp release-notes.md
          fi

          cat release-notes.md

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          # The experimental version string carries its own prerelease segment
          # (5.0.0-experimental.N), so the tag cannot collide with a stable v4.x
          # and no separate tag prefix is needed.
          tag:          v${{ needs.version-check.outputs.version }}
          name:         ${{ needs.version-check.outputs.experimental == 'true' && 'Experimental ' || '' }}v${{ needs.version-check.outputs.version }}
          bodyFile:     release-notes.md
          artifacts:    "artifacts/*.nupkg,artifacts/*.zip,artifacts/*.apk"
          draft:        false
          prerelease:   ${{ needs.version-check.outputs.experimental == 'true' }}
          allowUpdates: true
          # A version carrying a suffix (5.0.0-pre.2) is a prerelease; without this the
          # release is published as the latest stable one and has to be corrected by hand.
          prerelease:   ${{ contains(needs.version-check.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push NuGet packages to NuGet.org
        run: |
          EXIT_CODE=0
          for pkg in artifacts/*.nupkg; do
            echo "Pushing $pkg..."
            if dotnet nuget push "$pkg" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate; then
              echo "✓ Successfully pushed or already exists: $(basename $pkg)"
            else
              echo "✗ FAILED to push: $(basename $pkg)"
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE
