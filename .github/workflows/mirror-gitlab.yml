# Pushes main and the tags to the GitLab copy, whose free tier can't pull-mirror from GitHub.
# Needs the GITLAB_MIRROR_TOKEN secret in the release environment: a GitLab project access token
# (Maintainer, write_repository), with main's protection there allowing Maintainers to push.
name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency: gitlab-mirror

jobs:
  mirror:
    if: github.repository == 'TechIdiots-LLC/MaplibreNativeMAUI'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_MIRROR_TOKEN is not set"; exit 1
          fi
          url="https://oauth2:${GITLAB_TOKEN}@gitlab.techidiots.net/techidiots-llc/MaplibreNativeMAUI.git"
          git push "$url" refs/remotes/origin/main:refs/heads/main
          git push "$url" --tags
