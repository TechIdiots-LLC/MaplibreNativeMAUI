name: Native Android (OpenGL)

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # armeabi-v7a covers 32-bit ARM devices and 64-bit devices running a
        # 32-bit userland (older/budget tablets); arm64-v8a covers modern ones.
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27
        run: sdkmanager "ndk;27.0.12077973"

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLN_WITH_OPENGL=ON

      - name: Build mln-cabi
        timeout-minutes: 60
        run: cmake --build build --target mln-cabi --parallel 4

      # Google Play rejects 64-bit .so files whose LOAD segments align below 16 KB.
      - name: Verify 16 KB page alignment
        run: |
          SO=$(find build -name libmln-cabi.so | head -1)
          python3 - "$SO" <<'EOF'
          import struct, sys
          path = sys.argv[1]
          with open(path, 'rb') as f:
              head = f.read(64)
              if head[4] != 2:
                  print(path, 'is 32-bit; 16 KB pages are a 64-bit requirement')
                  raise SystemExit(0)
              phoff, = struct.unpack_from('<Q', head, 0x20)
              phentsize, phnum = struct.unpack_from('<HH', head, 0x36)
              f.seek(phoff)
              ph = f.read(phentsize * phnum)
          aligns = [struct.unpack_from('<Q', ph, i * phentsize + 0x30)[0]
                    for i in range(phnum)
                    if struct.unpack_from('<I', ph, i * phentsize)[0] == 1]
          print(path, 'LOAD aligns:', [hex(a) for a in aligns])
          if not aligns or min(aligns) < 16384:
              sys.exit('::error::%s is not 16 KB page aligned' % path)
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-android-${{ matrix.abi }}
          path: build/**/libmln-cabi.so
          retention-days: 7
